version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Le CLI Supabase est épinglé volontairement : mise à jour manuelle après lecture du changelog.
    ignore:
      - dependency-name: supabase
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Types alignés sur la version majeure du runtime (Node 22 en CI) :
      # à monter en même temps que node-version dans ci.yml.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
